name: Build APK (manual only)

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'APK label (optional)'
        required: false
        default: 'madish-debug'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stage web app
        run: |
          rm -rf dist && mkdir -p dist
          cp index.html styles.css app.js manifest.webmanifest sw.js dist/
          mkdir -p dist/data dist/assets
          cp data/dishes.json dist/data/
          cp -r assets/icons assets/dishes assets/ingredients dist/assets/
          # keep the bundle lean: block backend/sw source from WebView bundle
          rm -rf dist/assets/ingredients/__tests__ 2>/dev/null || true

      - name: Init Capacitor
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 >/dev/null 2>&1
          npx cap init MADish com.madish.app --web-dir=dist >/dev/null
          npx cap add android >/dev/null
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.label }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
